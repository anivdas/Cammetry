name: Build Unsigned Windows Test Artifacts

on:
  workflow_dispatch:
  push:
    branches: [ v0.5.1-beta ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build unsigned Windows test artifacts
        shell: pwsh
        run: .\Build-Release.ps1

      - name: Upload unsigned test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cammetry-Windows-v0.5.1-UNSIGNED-BETA
          path: release/*

      - name: Signing notice
        shell: pwsh
        run: |
          Write-Host 'These artifacts are intentionally unsigned v0.5.1 beta test builds.'
          Write-Host 'Do not attach them to an official GitHub Release.'
          Write-Host 'Official Windows release tags use windows-signpath-release.yml after SignPath enrollment.'
