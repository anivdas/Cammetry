name: Package Cammetry v0.6.0 Beta

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cammetry-windows-v0.6.0-beta
  cancel-in-progress: false

env:
  VERSION: 0.6.0-beta

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Verify release version is consistent
        shell: pwsh
        run: |
          $Expected = '0.6.0-beta'
          $Files = @('cammetry.py', 'Build-Release.ps1', 'installer/Cammetry.nsi', 'version_info.txt')
          foreach ($File in $Files) {
            if ((Get-Content $File -Raw) -notmatch [regex]::Escape($Expected)) {
              throw "$File does not contain release version $Expected"
            }
          }

      - name: Build unsigned Windows beta
        shell: pwsh
        run: .\Build-Release.ps1

      - name: Smoke-test install, packaged launch, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Setup = (Resolve-Path ".\release\Cammetry-Setup-v$env:VERSION.exe").Path
          $SmokeDir = Join-Path $env:RUNNER_TEMP 'CammetrySmoke'
          Remove-Item -Recurse -Force $SmokeDir -ErrorAction SilentlyContinue

          $Install = Start-Process -FilePath $Setup -ArgumentList @('/S', "/D=$SmokeDir") -Wait -PassThru
          if ($Install.ExitCode -ne 0) { throw "Setup failed with exit code $($Install.ExitCode)" }

          $AppExe = Join-Path $SmokeDir 'Cammetry.exe'
          $Uninstaller = Join-Path $SmokeDir 'Uninstall.exe'
          if (-not (Test-Path $AppExe)) { throw 'Cammetry.exe was not installed.' }
          if (-not (Test-Path $Uninstaller)) { throw 'Uninstall.exe was not installed.' }

          $ProductVersion = (Get-Item $AppExe).VersionInfo.ProductVersion
          if ($ProductVersion -notlike '0.6.0-beta*') {
            throw "Unexpected installed ProductVersion: $ProductVersion"
          }

          $Process = Start-Process -FilePath $AppExe -PassThru
          Start-Sleep -Seconds 5
          if ($Process.HasExited) {
            throw "Cammetry exited during startup with code $($Process.ExitCode)"
          }
          Stop-Process -Id $Process.Id -Force
          $Process.WaitForExit()

          $Uninstall = Start-Process -FilePath $Uninstaller -ArgumentList @('/S') -Wait -PassThru
          if ($Uninstall.ExitCode -ne 0) { throw "Uninstall failed with exit code $($Uninstall.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path $SmokeDir) {
            $Remaining = Get-ChildItem -Force $SmokeDir -ErrorAction SilentlyContinue
            throw "Uninstall left files behind: $($Remaining.FullName -join ', ')"
          }

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File |
            Where-Object Extension -In '.exe', '.zip' |
            ForEach-Object {
              $Hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$Hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
            }

      - name: Upload Setup installer
        uses: actions/upload-artifact@v4
        with:
          name: Cammetry-Setup-v0.6.0-beta-UNSIGNED
          path: |
            release/Cammetry-Setup-v0.6.0-beta.exe
            release/Cammetry-Setup-v0.6.0-beta.exe.sha256
          if-no-files-found: error

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Cammetry-Portable-EXE-v0.6.0-beta-UNSIGNED
          path: |
            release/Cammetry-Portable-v0.6.0-beta.exe
            release/Cammetry-Portable-v0.6.0-beta.exe.sha256
          if-no-files-found: error

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Cammetry-Portable-ZIP-v0.6.0-beta-UNSIGNED
          path: |
            release/Cammetry-Portable-v0.6.0-beta.zip
            release/Cammetry-Portable-v0.6.0-beta.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.0-beta
          target_commitish: ${{ github.sha }}
          name: Cammetry v0.6.0 Beta - Unsigned Test Build
          prerelease: true
          generate_release_notes: false
          body: |
            Cammetry v0.6.0 Beta adds the new review, incident, privacy, library,
            continuous-playback, compatibility, and local event-detection features.

            This Windows test build is unsigned. Windows SmartScreen may show an
            unknown-publisher warning. Download only from this official release page
            and verify the accompanying SHA-256 file if desired.

            The WinUI 3 shell is included in the source as a compiled migration
            foundation, but this beta installer continues to use Cammetry's mature
            desktop interface while native viewer parity is completed.

            Cammetry processes footage and telemetry locally by default. Preserve
            original TeslaCam files and report bugs without publicly uploading private
            footage or GPS data.
          files: |
            release/Cammetry-Setup-v0.6.0-beta.exe
            release/Cammetry-Setup-v0.6.0-beta.exe.sha256
            release/Cammetry-Portable-v0.6.0-beta.exe
            release/Cammetry-Portable-v0.6.0-beta.exe.sha256
            release/Cammetry-Portable-v0.6.0-beta.zip
            release/Cammetry-Portable-v0.6.0-beta.zip.sha256
          fail_on_unmatched_files: true
