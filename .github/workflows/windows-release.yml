name: Build and Publish Unsigned Windows Beta

on:
  workflow_dispatch:
  push:
    branches: [ v0.5.1-beta ]

permissions:
  contents: write

concurrency:
  group: cammetry-windows-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build unsigned Windows beta artifacts
        shell: pwsh
        run: .\Build-Release.ps1

      - name: Smoke-test Setup install, packaged launch, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Setup = (Resolve-Path '.\release\Cammetry-Setup-v0.5.1.exe').Path
          $SmokeDir = Join-Path $env:RUNNER_TEMP 'CammetrySmoke'
          Remove-Item -Recurse -Force $SmokeDir -ErrorAction SilentlyContinue

          Write-Host "Installing beta silently to $SmokeDir"
          $InstallProcess = Start-Process -FilePath $Setup -ArgumentList @('/S', "/D=$SmokeDir") -Wait -PassThru
          if ($InstallProcess.ExitCode -ne 0) { throw "Setup smoke install failed with exit code $($InstallProcess.ExitCode)" }

          $AppExe = Join-Path $SmokeDir 'Cammetry.exe'
          $Uninstaller = Join-Path $SmokeDir 'Uninstall.exe'
          if (-not (Test-Path $AppExe)) { throw 'Setup completed but Cammetry.exe was not installed.' }
          if (-not (Test-Path $Uninstaller)) { throw 'Setup completed but Uninstall.exe was not installed.' }

          $Version = (Get-Item $AppExe).VersionInfo.ProductVersion
          if ($Version -notlike '0.5.1*') { throw "Installed Cammetry.exe has unexpected ProductVersion: $Version" }

          Write-Host 'Launching packaged Cammetry.exe for startup smoke test...'
          $Process = Start-Process -FilePath $AppExe -PassThru
          Start-Sleep -Seconds 4
          if ($Process.HasExited) { throw "Packaged Cammetry.exe exited during startup smoke test with code $($Process.ExitCode)." }
          Stop-Process -Id $Process.Id -Force
          $Process.WaitForExit()

          Write-Host 'Running silent uninstall...'
          $UninstallProcess = Start-Process -FilePath $Uninstaller -ArgumentList @('/S') -Wait -PassThru
          if ($UninstallProcess.ExitCode -ne 0) { throw "Uninstall smoke test failed with exit code $($UninstallProcess.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path $SmokeDir) {
            $Remaining = Get-ChildItem -Force $SmokeDir -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw "Uninstall left the install directory behind. Remaining: $($Remaining -join ', ')"
          }
          Write-Host 'Setup/install/launch/uninstall smoke test passed.' -ForegroundColor Green

      - name: Upload Setup installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cammetry-Setup-v0.5.1-UNSIGNED-BETA
          path: release/Cammetry-Setup-v0.5.1.exe
          if-no-files-found: error

      - name: Upload portable EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cammetry-Portable-EXE-v0.5.1-UNSIGNED-BETA
          path: release/Cammetry-Portable-v0.5.1.exe
          if-no-files-found: error

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cammetry-Portable-ZIP-v0.5.1-UNSIGNED-BETA
          path: release/Cammetry-Portable-v0.5.1.zip
          if-no-files-found: error

      - name: Publish unsigned beta to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.1-beta
          target_commitish: ${{ github.sha }}
          name: Cammetry v0.5.1 Beta - Unsigned Test Build
          prerelease: true
          make_latest: false
          body: |
            ## Cammetry v0.5.1 Beta

            This is a public **unsigned test build** published while Cammetry's SignPath code-signing certification is pending.

            ### What's ready for testing
            - NVIDIA NVENC accelerated export support
            - Updated HUD and telemetry presentation
            - Refined playback and transport controls
            - Map overlay sizing and placement controls
            - Multi-camera TeslaCam viewing and export workflow improvements
            - Installer, portable EXE, and portable ZIP options

            ### Windows download options
            - **Cammetry-Setup-v0.5.1.exe** - normal Windows installer
            - **Cammetry-Portable-v0.5.1.exe** - single-file portable build
            - **Cammetry-Portable-v0.5.1.zip** - portable ZIP package

            ### Important: unsigned build
            Windows SmartScreen may warn because this beta has **not yet been code-signed**. SignPath certification is in progress. A signed release will replace this test build once certification is complete.

            Please report reproducible issues through GitHub Issues and include your Windows version, GPU, and whether NVENC was enabled when relevant.

            Cammetry is free and open source, local-first, and privacy-focused. It is an independent project and is not affiliated with or endorsed by Tesla, Inc.
          files: |
            release/Cammetry-Setup-v0.5.1.exe
            release/Cammetry-Portable-v0.5.1.exe
            release/Cammetry-Portable-v0.5.1.zip
          fail_on_unmatched_files: true

      - name: Signing notice
        shell: pwsh
        run: |
          Write-Host 'Published v0.5.1-beta as an intentionally unsigned public test release.'
          Write-Host 'The signed production release remains gated on SignPath certification.'
