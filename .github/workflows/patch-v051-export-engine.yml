        current = _add_blur_filters(filters, wall_label, options.blur_zones, canvas)
        ass_arg = ffmpeg_escape_filter_path(ass_path)
        filters.append(f"[{current}]ass='{ass_arg}'[hud]")
        current = "hud"
        if route_input_index is not None:
            filters.append(f"[{route_input_index}:v]scale=360:240[map]")
            filters.append(f"[{current}][map]overlay=W-w-28:28:shortest=1[final]")
            current = "final"

        cmd += ["-filter_complex", ";".join(filters), "-map", f"[{current}]", "-an"]
        cmd += _codec_args(codec, options.quality)
        cmd += ["-pix_fmt", "yuv420p", "-movflags", "+faststart", str(output)]
        _run_ffmpeg(cmd, duration, progress_cb)
    return encoder_name
'''
          new_cmd_block = '''        def build_command(active_codec: str) -> List[str]:
            cmd: List[str] = [ffmpeg, "-y"]
            for camera in cameras:
                cmd += ["-ss", f"{start:.3f}", "-t", f"{duration:.3f}", "-i", str(group.cameras[camera])]
            route_input_index = None
            if route_path:
                route_input_index = len(cameras)
                cmd += ["-stream_loop", "-1", "-i", str(route_path)]

            filters, wall_label, canvas = _compose_layout_filter(cameras, options.layout, options)
            current = _add_blur_filters(filters, wall_label, options.blur_zones, canvas)
            ass_arg = ffmpeg_escape_filter_path(ass_path)
            filters.append(f"[{current}]ass='{ass_arg}'[hud]")
            current = "hud"
            if route_input_index is not None:
                filters.append(f"[{route_input_index}:v]scale=360:240[map]")
                filters.append(f"[{current}][map]overlay=W-w-28:28:shortest=1[final]")
                current = "final"

            cmd += ["-filter_complex", ";".join(filters), "-map", f"[{current}]", "-an"]
            cmd += _codec_args(active_codec, options.quality)
            cmd += ["-pix_fmt", "yuv420p", "-movflags", "+faststart", str(output)]
            return cmd

        try:
            _run_ffmpeg(build_command(codec), duration, progress_cb)
            return encoder_name
        except RuntimeError as hardware_error:
            if codec == "libx264":
                raise
            try:
                output.unlink(missing_ok=True)
            except Exception:
                pass
            if progress_cb:
                progress_cb(0.0, f"{encoder_name} unavailable; retrying with CPU x264")
            try:
                _run_ffmpeg(build_command("libx264"), duration, progress_cb)
                return f"CPU x264 (fallback from {encoder_name})"
            except RuntimeError as cpu_error:
                raise RuntimeError(
                    f"{encoder_name} failed and the CPU fallback also failed.\\n\\n"
                    f"Hardware encoder error:\\n{hardware_error}\\n\\nCPU fallback error:\\n{cpu_error}"
                ) from cpu_error
'''
          if old_cmd_block not in s:
