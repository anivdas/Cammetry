name: One-time v0.5.1 export engine patch

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch export reliability and overlay controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tts_export.py')
          s = p.read_text(encoding='utf-8')

          old = '''    show_gps_text: bool = False
    show_gforce: bool = True
    blur_zones: List[BlurZone] = field(default_factory=list)
'''
          new = '''    show_gps_text: bool = False
    show_gforce: bool = True
    show_speed: bool = True
    show_state: bool = True
    show_gear: bool = True
    show_steering: bool = True
    show_accelerator: bool = True
    show_brake: bool = True
    apply_image_adjustments: bool = True
    exposure: float = 0.0
    contrast: float = 1.0
    saturation: float = 1.0
    gamma: float = 1.0
    blur_zones: List[BlurZone] = field(default_factory=list)
'''
          if old not in s:
              raise SystemExit('ExportOptions insertion point not found')
          s = s.replace(old, new, 1)

          start = s.index('def available_encoders() -> List[str]:')
          end = s.index('\ndef resolve_encoder', start)
          replacement = '''_ENCODER_SMOKE_CACHE: Dict[Tuple[str, str], bool] = {}


def _encoder_smoke_test(codec: str) -> bool:
    if codec == "libx264":
        return True
    ffmpeg = get_ffmpeg_exe()
    key = (ffmpeg, codec)
    if key in _ENCODER_SMOKE_CACHE:
        return _ENCODER_SMOKE_CACHE[key]
    creationflags = subprocess.CREATE_NO_WINDOW if os.name == "nt" else 0
    cmd = [
        ffmpeg, "-hide_banner", "-loglevel", "error",
        "-f", "lavfi", "-i", "color=c=black:s=64x64:d=0.08",
        "-frames:v", "1", "-an", "-c:v", codec, "-f", "null", "-",
    ]
    try:
        result = subprocess.run(
            cmd, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
            timeout=8, creationflags=creationflags,
        )
        ok = result.returncode == 0
    except Exception:
        ok = False
    _ENCODER_SMOKE_CACHE[key] = ok
    return ok


def available_encoders() -> List[str]:
    """Return encoders that are both compiled into FFmpeg and usable on this machine."""
    ffmpeg = get_ffmpeg_exe()
    creationflags = subprocess.CREATE_NO_WINDOW if os.name == "nt" else 0
    try:
        out = subprocess.check_output(
            [ffmpeg, "-hide_banner", "-encoders"], text=True, errors="replace",
            stderr=subprocess.STDOUT, timeout=10, creationflags=creationflags,
        )
    except Exception:
        return ["CPU x264"]
    candidates = [
        ("NVIDIA NVENC", "h264_nvenc"),
        ("Intel QuickSync", "h264_qsv"),
        ("AMD AMF", "h264_amf"),
        ("Apple VideoToolbox", "h264_videotoolbox"),
    ]
    encoders: List[str] = []
    for display, codec in candidates:
        if codec in out and _encoder_smoke_test(codec):
            encoders.append(display)
    encoders.append("CPU x264")
    return encoders

'''
          s = s[:start] + replacement + s[end+1:]

          old_segment = '''        state = assist_label(options.language, sample.autopilot_state)
        if sample.blinker_on_left:
            state += "   ◀"
        if sample.blinker_on_right:
            state += "   ▶"
        accel = sample.accelerator_pedal_position
        gmag = math.sqrt(
            sample.linear_acceleration_mps2_x ** 2 + sample.linear_acceleration_mps2_y ** 2 + sample.linear_acceleration_mps2_z ** 2
        ) / 9.80665
        gear_label = tr(options.language, "gear")
        steer_label = tr(options.language, "steering")
        accel_label = tr(options.language, "accelerator")
        brake_label = tr(options.language, "brake")
        details = f"{gear_label} {sample.gear}   •   {steer_label} {sample.steering_wheel_angle:+.1f}°   •   {accel_label} {accel:.2f}   •   {brake_label} {tr(options.language, 'on') if sample.brake_applied else tr(options.language, 'off')}"
        if options.show_gforce:
            details += f"   •   {gmag:.2f} g"
        if options.show_gps_text and (abs(sample.latitude_deg) > 1e-8 or abs(sample.longitude_deg) > 1e-8):
            details += f"   •   {sample.latitude_deg:.5f}, {sample.longitude_deg:.5f}"
        if options.show_dashboard:
            if options.dashboard_style == "Compact":
                compact = f"{speed:0.0f} {unit}   •   {gear_label} {sample.gear}   •   {state}   •   {steer_label} {sample.steering_wheel_angle:+.1f}°"
                lines.append(f"Dialogue: 0,{begin_s},{end_s},State,0,0,0,{ass_escape(compact)}\\n")
            else:
                lines.append(f"Dialogue: 0,{begin_s},{end_s},Speed,0,0,0,{speed:0.0f} {unit}\\n")
                lines.append(f"Dialogue: 0,{begin_s},{end_s},State,0,0,0,{ass_escape(state)}\\n")
                lines.append(f"Dialogue: 0,{begin_s},{end_s},Detail,0,0,0,{ass_escape(details)}\\n")
'''
          new_segment = '''        state = assist_label(options.language, sample.autopilot_state)
        if sample.blinker_on_left:
            state += "   ◀"
        if sample.blinker_on_right:
            state += "   ▶"
        accel = sample.accelerator_pedal_position
        gmag = math.sqrt(
            sample.linear_acceleration_mps2_x ** 2 + sample.linear_acceleration_mps2_y ** 2 + sample.linear_acceleration_mps2_z ** 2
        ) / 9.80665
        gear_label = tr(options.language, "gear")
        steer_label = tr(options.language, "steering")
        accel_label = tr(options.language, "accelerator")
        brake_label = tr(options.language, "brake")
        brake_value = tr(options.language, 'on') if sample.brake_applied else tr(options.language, 'off')
        gps_valid = abs(sample.latitude_deg) > 1e-8 or abs(sample.longitude_deg) > 1e-8

        detail_parts: List[str] = []
        if options.show_gear:
            detail_parts.append(f"{gear_label} {sample.gear}")
        if options.show_steering:
            detail_parts.append(f"{steer_label} {sample.steering_wheel_angle:+.1f}°")
        if options.show_accelerator:
            detail_parts.append(f"{accel_label} {accel:.2f}")
        if options.show_brake:
            detail_parts.append(f"{brake_label} {brake_value}")
        if options.show_gforce:
            detail_parts.append(f"{gmag:.2f} g")
        if options.show_gps_text and gps_valid:
            detail_parts.append(f"{sample.latitude_deg:.5f}, {sample.longitude_deg:.5f}")
        details = "   •   ".join(detail_parts)

        if options.show_dashboard:
            if options.dashboard_style == "Compact":
                compact_parts: List[str] = []
                if options.show_speed:
                    compact_parts.append(f"{speed:0.0f} {unit}")
                if options.show_gear:
                    compact_parts.append(f"{gear_label} {sample.gear}")
                if options.show_state:
                    compact_parts.append(state)
                if options.show_steering:
                    compact_parts.append(f"{steer_label} {sample.steering_wheel_angle:+.1f}°")
                if options.show_accelerator:
                    compact_parts.append(f"{accel_label} {accel:.2f}")
                if options.show_brake:
                    compact_parts.append(f"{brake_label} {brake_value}")
                if options.show_gforce:
                    compact_parts.append(f"{gmag:.2f} g")
                if options.show_gps_text and gps_valid:
                    compact_parts.append(f"{sample.latitude_deg:.5f}, {sample.longitude_deg:.5f}")
                if compact_parts:
                    lines.append(f"Dialogue: 0,{begin_s},{end_s},State,0,0,0,{ass_escape('   •   '.join(compact_parts))}\\n")
            else:
                if options.show_speed:
                    lines.append(f"Dialogue: 0,{begin_s},{end_s},Speed,0,0,0,{speed:0.0f} {unit}\\n")
                if options.show_state:
                    lines.append(f"Dialogue: 0,{begin_s},{end_s},State,0,0,0,{ass_escape(state)}\\n")
                if details:
                    lines.append(f"Dialogue: 0,{begin_s},{end_s},Detail,0,0,0,{ass_escape(details)}\\n")
'''
          if old_segment not in s:
              raise SystemExit('Dashboard segment not found')
          s = s.replace(old_segment, new_segment, 1)

          old_layout_start = s.index('def _compose_layout_filter(cameras: List[str], layout: str)')
          old_layout_end = s.index('\ndef _add_blur_filters', old_layout_start)
          new_layout = '''def _image_filter(options: ExportOptions) -> str:
    if not options.apply_image_adjustments:
        return ""
    brightness = max(-1.0, min(1.0, float(options.exposure) * 0.12))
    contrast = max(0.25, min(3.0, float(options.contrast)))
    saturation = max(0.0, min(3.0, float(options.saturation)))
    gamma = max(0.1, min(4.0, float(options.gamma)))
    if abs(brightness) < 1e-4 and abs(contrast - 1.0) < 1e-4 and abs(saturation - 1.0) < 1e-4 and abs(gamma - 1.0) < 1e-4:
        return ""
    return f"eq=brightness={brightness:.4f}:contrast={contrast:.4f}:saturation={saturation:.4f}:gamma={gamma:.4f}"


def _compose_layout_filter(cameras: List[str], layout: str, options: Optional[ExportOptions] = None) -> Tuple[List[str], str, Tuple[int, int]]:
    filters: List[str] = []
    image_filter = _image_filter(options) if options is not None else ""
    sources: List[str] = []
    for i in range(len(cameras)):
        if image_filter:
            filters.append(f"[{i}:v]{image_filter}[src{i}]")
            sources.append(f"[src{i}]")
        else:
            sources.append(f"[{i}:v]")

    if len(cameras) == 1 or layout == "Single Camera":
        filters.append(f"{sources[0]}scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:color=black[wall]")
        return filters, "wall", (1920, 1080)

    if layout == "Four Camera" and len(cameras) >= 4:
        for i in range(4):
            filters.append(f"{sources[i]}scale=960:540:force_original_aspect_ratio=decrease,pad=960:540:(ow-iw)/2:(oh-ih)/2:color=black[v{i}]")
        filters += ["[v0][v1]hstack=inputs=2[top]", "[v2][v3]hstack=inputs=2[bottom]", "[top][bottom]vstack=inputs=2[wall]"]
        return filters, "wall", (1920, 1080)

    n = min(6, len(cameras))
    for i in range(n):
        filters.append(f"{sources[i]}scale=640:540:force_original_aspect_ratio=decrease,pad=640:540:(ow-iw)/2:(oh-ih)/2:color=black[v{i}]")
    for i in range(n, 6):
        filters.append(f"color=c=black:s=640x540:d=86400[v{i}]")
    filters += [
        "[v0][v1][v2]hstack=inputs=3[row0]",
        "[v3][v4][v5]hstack=inputs=3[row1]",
        "[row0][row1]vstack=inputs=2[wall]",
    ]
    return filters, "wall", (1920, 1080)

'''
          s = s[:old_layout_start] + new_layout + s[old_layout_end+1:]

          s = s.replace('filters, wall_label, canvas = _compose_layout_filter(cameras, options.layout)', 'filters, wall_label, canvas = _compose_layout_filter(cameras, options.layout, options)', 1)

          old_cmd_block = '''        cmd: List[str] = [ffmpeg, "-y"]
        for camera in cameras:
            cmd += ["-ss", f"{start:.3f}", "-t", f"{duration:.3f}", "-i", str(group.cameras[camera])]
        route_input_index = None
        if route_path:
            route_input_index = len(cameras)
            cmd += ["-stream_loop", "-1", "-i", str(route_path)]

