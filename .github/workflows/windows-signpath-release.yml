name: Build, Sign and Publish Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (example: 0.5.1)'
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  sign-windows:
    runs-on: windows-latest
    timeout-minutes: 330

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = '${{ inputs.version }}'
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Cammetry release versions must currently use numeric X.Y.Z format. Got: $version"
          }
          "CAMMETRY_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release version: $version"

      - name: Verify source version matches release
        shell: pwsh
        run: |
          $core = Get-Content 'tts_core.py' -Raw
          $nsi = Get-Content 'installer\Cammetry.nsi' -Raw
          $versionInfo = Get-Content 'version_info.txt' -Raw
          if ($core -notmatch ('APP_VERSION\s*=\s*"' + [regex]::Escape($env:CAMMETRY_VERSION) + '"')) {
            throw "tts_core.py APP_VERSION does not match $env:CAMMETRY_VERSION. Bump the source version before tagging."
          }
          if ($nsi -notmatch ('!define APP_VERSION\s+"' + [regex]::Escape($env:CAMMETRY_VERSION) + '"')) {
            throw "installer/Cammetry.nsi APP_VERSION does not match $env:CAMMETRY_VERSION."
          }
          if ($versionInfo -notmatch ('ProductVersion.*' + [regex]::Escape($env:CAMMETRY_VERSION))) {
            throw "version_info.txt ProductVersion does not match $env:CAMMETRY_VERSION."
          }

      - name: Verify SignPath enrollment secrets
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) {
            throw 'SIGNPATH_API_TOKEN is not configured. Official Windows releases fail closed rather than publish unsigned files.'
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID)) {
            throw 'SIGNPATH_ORGANIZATION_ID is not configured.'
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build unsigned Windows artifacts
        shell: pwsh
        run: .\Build-Release.ps1

      - name: Prepare first SignPath artifact
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force signpath-inner -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force signpath-inner | Out-Null
          Copy-Item 'dist-installer\Cammetry\Cammetry.exe' 'signpath-inner\Cammetry.exe'
          Copy-Item "release\Cammetry-Portable-v$env:CAMMETRY_VERSION.exe" "signpath-inner\Cammetry-Portable-v$env:CAMMETRY_VERSION.exe"
          Compress-Archive -Path 'signpath-inner\*' -DestinationPath "Cammetry-SignPath-Inner-v$env:CAMMETRY_VERSION.zip" -Force

      - name: Upload first unsigned SignPath artifact
        id: upload-inner
        uses: actions/upload-artifact@v7
        with:
          path: Cammetry-SignPath-Inner-v${{ env.CAMMETRY_VERSION }}.zip
          archive: false

      - name: Sign Cammetry application and portable EXE
        id: sign-inner
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'cammetry'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'windows-inner'
          github-artifact-id: '${{ steps.upload-inner.outputs.artifact-id }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '7200'
          output-artifact-directory: '${{ github.workspace }}\signed-inner'
          skip-decompress: true
          parameters: |
            version: "${{ env.CAMMETRY_VERSION }}"

      - name: Install first signed artifacts
        shell: pwsh
        run: |
          $sourceRoot = 'signed-inner'
          $workRoot = 'signed-inner-expanded'
          Remove-Item -Recurse -Force $workRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $workRoot | Out-Null

          $signedApp = Get-ChildItem -Path $sourceRoot -Filter 'Cammetry.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $signedApp) {
            $signedZip = Get-ChildItem -Path $sourceRoot -Filter '*.zip' -Recurse | Select-Object -First 1
            if (-not $signedZip) { throw 'SignPath did not return the expected signed inner artifact.' }
            Expand-Archive -Path $signedZip.FullName -DestinationPath $workRoot -Force
            $signedApp = Get-ChildItem -Path $workRoot -Filter 'Cammetry.exe' -Recurse | Select-Object -First 1
          }
          $signedPortable = Get-ChildItem -Path $sourceRoot,$workRoot -Filter "Cammetry-Portable-v$env:CAMMETRY_VERSION.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $signedApp -or -not $signedPortable) { throw 'Signed application or portable executable is missing.' }

          Copy-Item $signedApp.FullName 'dist-installer\Cammetry\Cammetry.exe' -Force
          Copy-Item $signedPortable.FullName "release\Cammetry-Portable-v$env:CAMMETRY_VERSION.exe" -Force

          $sig = Get-AuthenticodeSignature 'dist-installer\Cammetry\Cammetry.exe'
          if ($sig.Status -ne 'Valid') { throw "Signed Cammetry.exe validation failed: $($sig.Status)" }
          $sig = Get-AuthenticodeSignature "release\Cammetry-Portable-v$env:CAMMETRY_VERSION.exe"
          if ($sig.Status -ne 'Valid') { throw "Signed portable EXE validation failed: $($sig.Status)" }

          $portableFolder = "release\Cammetry-Portable-v$env:CAMMETRY_VERSION"
          Remove-Item -Recurse -Force $portableFolder -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $portableFolder | Out-Null
          Copy-Item "release\Cammetry-Portable-v$env:CAMMETRY_VERSION.exe" "$portableFolder\Cammetry.exe"
          Copy-Item README.md, LICENSE, PRIVACY.md, CHANGELOG.md, THIRD_PARTY_NOTICES.md, TRADEMARKS.md, CODE_SIGNING_POLICY.md "$portableFolder\"
          Compress-Archive -Path "$portableFolder\*" -DestinationPath "release\Cammetry-Portable-v$env:CAMMETRY_VERSION.zip" -Force
          Remove-Item -Recurse -Force $portableFolder

      - name: Rebuild NSIS Setup around signed application
        shell: pwsh
        run: |
          $makeNsis = @(
            "$env:ProgramFiles\NSIS\makensis.exe",
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $makeNsis) { throw 'NSIS compiler not found.' }
          Push-Location installer
          try {
            & $makeNsis 'Cammetry.nsi'
            if ($LASTEXITCODE -ne 0) { throw 'NSIS rebuild failed.' }
          } finally { Pop-Location }

      - name: Upload unsigned Setup for final signing
        id: upload-setup
        uses: actions/upload-artifact@v7
        with:
          path: release/Cammetry-Setup-v${{ env.CAMMETRY_VERSION }}.exe
          archive: false

      - name: Sign final Windows Setup
        id: sign-setup
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'cammetry'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'windows-setup'
          github-artifact-id: '${{ steps.upload-setup.outputs.artifact-id }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '7200'
          output-artifact-directory: '${{ github.workspace }}\signed-setup'
          skip-decompress: true
          parameters: |
            version: "${{ env.CAMMETRY_VERSION }}"

      - name: Install and verify signed Setup
        shell: pwsh
        run: |
          $signedSetup = Get-ChildItem -Path 'signed-setup' -Filter "Cammetry-Setup-v$env:CAMMETRY_VERSION.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $signedSetup) {
            $candidate = Get-ChildItem -Path 'signed-setup' -Filter '*.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($candidate) { $signedSetup = $candidate }
          }
          if (-not $signedSetup) { throw 'SignPath did not return the signed Setup executable.' }
          Copy-Item $signedSetup.FullName "release\Cammetry-Setup-v$env:CAMMETRY_VERSION.exe" -Force

          $files = @(
            "release\Cammetry-Setup-v$env:CAMMETRY_VERSION.exe",
            "release\Cammetry-Portable-v$env:CAMMETRY_VERSION.exe"
          )
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne 'Valid') { throw "Authenticode validation failed for $file: $($sig.Status)" }
            Write-Host "$file signed by $($sig.SignerCertificate.Subject)"
          }

      - name: Upload signed Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cammetry-Windows-SIGNED-v${{ env.CAMMETRY_VERSION }}
          path: |
            release/Cammetry-Setup-v${{ env.CAMMETRY_VERSION }}.exe
            release/Cammetry-Portable-v${{ env.CAMMETRY_VERSION }}.exe
            release/Cammetry-Portable-v${{ env.CAMMETRY_VERSION }}.zip

      - name: Publish signed Windows release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Cammetry-Setup-v${{ env.CAMMETRY_VERSION }}.exe
            release/Cammetry-Portable-v${{ env.CAMMETRY_VERSION }}.exe
            release/Cammetry-Portable-v${{ env.CAMMETRY_VERSION }}.zip
          generate_release_notes: true
          body: |
            ## Cammetry ${{ github.ref_name }}

            Official Cammetry Windows release assets are built from this repository on GitHub-hosted runners and Authenticode-signed through the project's controlled SignPath release workflow.

            ### Code signing policy
            Free code signing provided by SignPath.io, certificate by SignPath Foundation.

            See https://github.com/anivdas/Cammetry/blob/main/CODE_SIGNING_POLICY.md for project roles, privacy commitments, and release-signing rules.

            Cammetry is free and open source, local-first by default, and is not affiliated with or endorsed by Tesla, Inc.
