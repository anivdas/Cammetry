name: Publish Cammetry v0.5.0

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Build Windows release
        shell: pwsh
        run: .\Build-Release.ps1
      - name: Stage Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: release-macos-arm64
          - runner: macos-15-intel
            artifact: release-macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Build macOS app and DMG
        run: ./Build-macOS.sh
      - name: Stage macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.sha256.txt

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish v0.5.0 pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0
          name: Cammetry v0.5.0
          prerelease: true
          generate_release_notes: true
          body: |
            ## Cammetry v0.5.0

            First public Cammetry pre-release.

            Cammetry is a free, open-source, local-first TeslaCam viewer, telemetry explorer, and multi-camera exporter. Official Cammetry releases are intended to remain free of charge, with no paid tier, subscription, advertising requirement, or telemetry-selling business model.

            ### Downloads
            - **Windows:** use the `Cammetry-Setup-v0.5.0.exe` installer for the normal experience, or the portable build if you do not want to install the application.
            - **macOS Apple Silicon:** use the `arm64` DMG on M-series Macs.
            - **macOS Intel:** use the `x86_64` DMG on Intel Macs.

            ### Highlights
            - Up to six synchronized TeslaCam camera views
            - Embedded SEI telemetry decoding where available
            - Speed, gear, steering, pedals, braking, GPS, heading, acceleration, and driver-assistance state
            - Route, timeline, event browsing, snapshots, trimming, CSV export, privacy blur, and telemetry overlays
            - NVIDIA NVENC, Intel Quick Sync, AMD AMF, Apple VideoToolbox, and CPU encoding where supported
            - 13-language UI/message support
            - Local processing by default with no Tesla account required and no anonymous analytics

            ### Important
            This is a pre-1.0 community release. Preserve your original TeslaCam files and report bugs through GitHub Issues without uploading private footage or location data unless you intentionally choose to share it.

            Cammetry is independent software and is not affiliated with, endorsed by, sponsored by, or produced by Tesla, Inc.
          files: release-assets/*
