name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cammetry-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m py_compile cammetry.py tts_core.py tts_export.py tts_export_v051.py tts_export_guard.py tts_hud.py tts_locales.py tts_map.py tts_map_export.py tts_player.py tts_settings.py tts_ui.py tts_modern_ui.py tts_release_ui.py tts_final_ui.py tts_next_ui.py tts_beta_ui.py tts_hotfix_ui.py tts_updater.py tts_ui_polish.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
